<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — SIDDHI ElderCare Services</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" href="../logo-mark.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --pine-dark:#14495F; --pine:#2E7D6B; --sand:#F3EBDD; --cream:#FBF7EF;
    --ink:#241F18; --ink-soft:#5B5347; --line:#E4DBC9; --marigold:#E7C64C;
    --clayrose:#B85C56; --radius:14px; --radius-lg:20px;
  }
  *,*::before,*::after{ box-sizing:border-box; }
  body{ margin:0; font-family:'Inter',sans-serif; background:var(--cream); color:var(--ink); line-height:1.5; }
  .wrap{ max-width:760px; margin:0 auto; padding:48px 24px 80px; }
  h1{ font-size:1.4rem; margin:0 0 4px; }
  .sub{ color:var(--ink-soft); font-size:0.9rem; margin:0 0 32px; }

  /* Login */
  .login-card{ max-width:380px; margin:80px auto; background:#fff; border:1px solid var(--line); border-radius:var(--radius-lg); padding:32px 28px; }
  .login-card h1{ font-size:1.2rem; }
  .field{ margin-bottom:16px; display:flex; flex-direction:column; gap:6px; }
  .field label{ font-size:0.82rem; font-weight:600; }
  .field input, .field textarea{
    font-family:inherit; font-size:0.92rem; padding:10px 12px;
    border:1.5px solid var(--line); border-radius:8px; background:var(--cream); color:var(--ink);
  }
  .field input:focus, .field textarea:focus{ outline:none; border-color:var(--pine); }
  .field textarea{ resize:vertical; min-height:70px; }
  button{ font-family:inherit; cursor:pointer; }
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    background:var(--pine-dark); color:#fff; border:none; border-radius:999px;
    padding:11px 22px; font-size:0.9rem; font-weight:700; width:100%;
  }
  .btn:hover{ background:var(--pine); }
  .btn:disabled{ opacity:0.6; cursor:not-allowed; }
  .btn-secondary{ background:transparent; color:var(--ink-soft); border:1.5px solid var(--line); width:auto; padding:8px 16px; }
  .error{ color:var(--clayrose); font-size:0.85rem; margin-top:10px; display:none; }
  .error.is-visible{ display:block; }
  .success{ color:var(--pine); font-size:0.85rem; margin-top:10px; display:none; }
  .success.is-visible{ display:block; }

  /* Editor */
  .topbar{ display:flex; align-items:center; justify-content:space-between; margin-bottom:24px; flex-wrap:wrap; gap:12px; }
  .page-picker{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; }
  .page-picker button{
    background:#fff; border:1px solid var(--line); border-radius:999px;
    padding:8px 16px; font-size:0.85rem; font-weight:600; color:var(--ink-soft);
  }
  .page-picker button.is-active{ background:var(--pine-dark); color:#fff; border-color:var(--pine-dark); }
  .tools-label{
    flex-basis:100%; margin:0 0 2px; font-size:0.68rem; font-weight:700;
    letter-spacing:0.08em; text-transform:uppercase; color:var(--ink-soft);
  }
  #toolsPicker{ padding-top:14px; margin-bottom:24px; border-top:1px dashed var(--line); }
  .group{ background:#fff; border:1px solid var(--line); border-radius:var(--radius-lg); padding:22px 22px 6px; margin-bottom:18px; }
  .group > .group-title{ font-weight:700; font-size:0.95rem; margin:0 0 14px; color:var(--pine-dark); text-transform:capitalize; }
  .group .group{ background:var(--cream); }
  .item-index{ font-size:0.72rem; font-weight:700; letter-spacing:0.04em; text-transform:uppercase; color:var(--ink-soft); margin:0 0 8px; }
  .save-bar{ position:sticky; bottom:0; background:var(--cream); padding:16px 0; border-top:1px solid var(--line); margin-top:8px; display:flex; align-items:center; gap:16px; }
  .save-bar .btn{ width:auto; }
  .hint{ font-size:0.78rem; color:var(--ink-soft); }
  #loading{ color:var(--ink-soft); font-size:0.9rem; }


  /* Testimonials manager */
  .ta-top{ display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:6px; }
  .ta-top h2{ margin:0; font-size:1.15rem; }
  .ta-top .btn{ width:auto; }
  .ta-help{ background:#fff; border:1px solid var(--line); border-radius:var(--radius); padding:14px 16px; margin:0 0 18px; font-size:0.84rem; color:var(--ink-soft); }
  .ta-help strong{ color:var(--ink); }
  .ta-help ol{ margin:6px 0 0; padding-left:18px; }
  .ta-item{ padding:0 !important; overflow:hidden; }
  .ta-head{ display:flex; align-items:center; justify-content:space-between; gap:12px; padding:14px 16px; flex-wrap:wrap; }
  .ta-title{ display:flex; flex-direction:column; min-width:0; flex:1 1 220px; }
  .ta-title strong{ font-size:0.95rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .ta-meta{ font-size:0.78rem; color:var(--ink-soft); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .ta-badges{ display:flex; gap:6px; flex-wrap:wrap; }
  .ta-badge{ font-size:0.66rem; font-weight:700; letter-spacing:0.05em; text-transform:uppercase; padding:3px 9px; border-radius:999px; background:var(--sand); color:var(--pine-dark); }
  .ta-badge.video{ background:#dbeaf3; }
  .ta-badge.featured{ background:var(--marigold); }
  .ta-badge.hidden{ background:#f2dcda; color:var(--clayrose); }
  .ta-controls{ display:flex; gap:6px; }
  .ta-controls button{ background:#fff; border:1.5px solid var(--line); border-radius:8px; padding:6px 10px; font-size:0.8rem; font-weight:600; color:var(--ink-soft); }
  .ta-controls button:hover:not(:disabled){ border-color:var(--pine); color:var(--pine-dark); }
  .ta-controls button:disabled{ opacity:0.35; cursor:default; }
  .ta-controls .ta-del:hover{ border-color:var(--clayrose); color:var(--clayrose); }
  .ta-panel{ padding:4px 18px 8px; border-top:1px solid var(--line); background:var(--cream); }
  .ta-panel[hidden]{ display:none; }
  .ta-panel .field{ margin-top:14px; }
  .ta-row{ display:grid; grid-template-columns:1fr 1fr 110px; gap:12px; }
  .ta-row .field{ min-width:0; }
  .field select{ font-family:inherit; font-size:0.92rem; padding:10px 12px; border:1.5px solid var(--line); border-radius:8px; background:#fff; color:var(--ink); }
  .ta-panel textarea{ min-height:120px; }
  .ta-note{ font-size:0.76rem; color:var(--ink-soft); margin:0; }
  .ta-vstatus{ font-size:0.8rem; margin:2px 0 0; }
  .ta-vstatus.ok{ color:var(--pine); }
  .ta-vstatus.bad{ color:var(--clayrose); }
  .ta-vprev{ width:160px; border-radius:10px; margin-top:8px; display:block; }
  .ta-checks{ display:flex; flex-direction:column; gap:8px; margin:16px 0 12px; }
  .ta-check{ display:flex; align-items:flex-start; gap:10px; font-size:0.86rem; cursor:pointer; }
  .ta-check input{ margin-top:3px; accent-color:var(--pine); }
  .ta-empty{ text-align:center; color:var(--ink-soft); padding:30px 10px; font-size:0.9rem; }
  @media (max-width:620px){ .ta-row{ grid-template-columns:1fr; } }

  /* Invoice tool */
  .invoice-toolbar{ display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:18px; }
  .invoice-toolbar .btn{ width:auto; }
  .invoice-toolbar .btn-ghost{
    background:transparent; color:var(--pine-dark); border:1.5px solid var(--line);
    border-radius:999px; padding:10px 18px; font-size:0.85rem; font-weight:700;
  }
  .invoice-toolbar .btn-ghost.is-paid{ background:var(--pine); color:#fff; border-color:var(--pine); }
  .invoice-wrap{ position:relative; max-width:800px; }
  .invoice-sheet{
    position:relative; overflow:hidden;
    background:#fff; border:1px solid var(--line); border-radius:var(--radius-lg);
    padding:40px 44px 32px; box-shadow:0 1px 2px rgba(36,31,24,0.04), 0 16px 40px -20px rgba(36,31,24,0.25);
  }
  .invoice-sheet::before{
    content:''; position:absolute; top:0; left:0; right:0; height:6px;
    background:linear-gradient(90deg, var(--pine-dark), var(--pine) 55%, var(--marigold));
  }
  .invoice-sheet input, .invoice-sheet textarea{
    font-family:inherit; font-size:0.9rem; border:1px solid transparent; border-radius:6px;
    background:transparent; color:var(--ink); padding:4px 7px; width:100%; transition:background 0.15s, border-color 0.15s;
  }
  .invoice-sheet input:hover, .invoice-sheet textarea:hover{ border-color:var(--line); background:var(--cream); }
  .invoice-sheet input:focus, .invoice-sheet textarea:focus{ outline:none; border-color:var(--pine); background:var(--cream); }
  .invoice-sheet textarea{ resize:vertical; min-height:40px; }
  .invoice-head{ display:flex; justify-content:space-between; gap:24px; padding-bottom:22px; border-bottom:2px solid var(--ink); flex-wrap:wrap; }
  .invoice-brand{ display:flex; gap:14px; align-items:flex-start; }
  .invoice-logo-tile{
    width:56px; height:56px; border-radius:14px; background:var(--sand);
    display:flex; align-items:center; justify-content:center; flex:none;
  }
  .invoice-logo{ width:36px; height:36px; object-fit:contain; }
  .invoice-company-name{ margin:0; font-weight:700; font-size:1.1rem; letter-spacing:0.01em; color:var(--pine-dark); }
  .invoice-company-sub, .invoice-company-contact{ margin:3px 0 0; font-size:0.8rem; color:var(--ink-soft); }
  .invoice-meta{ text-align:right; min-width:220px; }
  .invoice-meta h2{ margin:0 0 12px; letter-spacing:0.14em; color:var(--pine-dark); font-size:1.4rem; font-weight:800; }
  .meta-row{ display:flex; justify-content:flex-end; align-items:center; gap:8px; font-size:0.85rem; margin-bottom:4px; }
  .meta-row label{ color:var(--ink-soft); font-weight:600; white-space:nowrap; min-width:38px; text-align:left; }
  .meta-row input{ text-align:right; max-width:150px; }
  .invoice-parties{ padding:22px 0; display:flex; justify-content:space-between; gap:24px; flex-wrap:wrap; }
  .invoice-parties > div{ flex:1; min-width:220px; }
  .party-label{ font-size:0.72rem; font-weight:700; letter-spacing:0.08em; text-transform:uppercase; color:var(--pine); margin:0 0 8px; }
  .invoice-table{ width:100%; border-collapse:collapse; margin-top:4px; }
  .invoice-table thead th{ text-align:left; font-size:0.72rem; text-transform:uppercase; letter-spacing:0.05em; color:var(--ink-soft); background:var(--sand); border-bottom:1.5px solid var(--ink); padding:9px 8px; }
  .invoice-table thead th:first-child{ border-top-left-radius:8px; }
  .invoice-table thead th:last-child{ border-top-right-radius:8px; }
  .invoice-table td{ border-bottom:1px solid var(--line); padding:7px 8px; vertical-align:top; }
  .invoice-table tbody tr:hover td{ background:var(--cream); }
  .invoice-table th:nth-child(1), .invoice-table td:nth-child(1){ width:34px; }
  .invoice-table th:nth-child(3), .invoice-table td:nth-child(3),
  .invoice-table th:nth-child(4), .invoice-table td:nth-child(4),
  .invoice-table th:nth-child(5), .invoice-table td:nth-child(5){ text-align:right; width:110px; }
  .invoice-table input{ text-align:right; }
  .invoice-table td:nth-child(2) input{ text-align:left; }
  .row-num{ color:var(--ink-soft); font-size:0.85rem; padding-top:11px !important; }
  .table-total td{ font-weight:800; border-bottom:1.5px solid var(--ink); padding-top:10px; font-variant-numeric:tabular-nums; }
  .table-total td:nth-child(2){ text-align:left; }
  .row-amount{ font-weight:600; font-variant-numeric:tabular-nums; }
  .row-remove-btn{ background:none; border:none; color:var(--clayrose); font-size:1.1rem; line-height:1; padding:4px; border-radius:6px; }
  .row-remove-btn:hover{ background:rgba(184,92,86,0.1); }
  .add-row-btn{ margin-top:10px; background:var(--cream); border:1.5px dashed var(--line); border-radius:8px; padding:9px 14px; font-size:0.85rem; font-weight:600; color:var(--pine-dark); width:100%; }
  .add-row-btn:hover{ border-color:var(--pine); background:var(--sand); }
  .invoice-totals{ margin:18px 0 0 auto; max-width:300px; background:var(--cream); border-radius:10px; padding:14px 16px; }
  .invoice-totals .totals-row input.money-input,
  .invoice-totals .totals-row input.mode-input{ width:130px; text-align:right; padding:2px 0 2px 6px; }
  .invoice-sheet input[type=number]{ -moz-appearance:textfield; appearance:textfield; }
  .invoice-sheet input[type=number]::-webkit-inner-spin-button,
  .invoice-sheet input[type=number]::-webkit-outer-spin-button{ -webkit-appearance:none; margin:0; }
  .invoice-payto .field-row label{ min-width:124px; }
  .invoice-summary{ display:flex; justify-content:space-between; align-items:flex-start; gap:24px; flex-wrap:wrap; margin-top:18px; }
  .invoice-summary .invoice-totals{ margin:0; flex:0 0 300px; }
  .invoice-words{ flex:1; min-width:200px; padding-top:4px; }
  .words-text{ margin:0; font-size:0.9rem; }
  .invoice-details{ text-align:right; }
  .invoice-details .meta-row label{ min-width:118px; }
  .invoice-details .meta-row input{ max-width:170px; }
  .field-row{ display:flex; align-items:center; gap:8px; font-size:0.85rem; margin-bottom:4px; }
  .field-row label{ color:var(--ink-soft); font-weight:600; white-space:nowrap; min-width:96px; }
  .invoice-foot{ display:flex; justify-content:space-between; align-items:flex-end; gap:24px; flex-wrap:wrap; margin-top:34px; }
  .invoice-payto{ flex:1; min-width:220px; }
  .invoice-sign{ min-width:220px; text-align:center; }
  .sign-for{ margin:0; font-size:0.85rem; font-weight:600; color:var(--ink-soft); }
  .sign-space{ height:54px; }
  .sign-label{ margin:0; padding-top:6px; border-top:1px solid var(--ink); font-size:0.8rem; font-weight:700; }
  .totals-row{ display:flex; justify-content:space-between; align-items:center; font-size:0.9rem; padding:5px 0; }
  .totals-row input{ width:44px; text-align:right; display:inline-block; padding:0 3px; }
  .total-final{ border-top:1.5px solid var(--ink); margin-top:6px; padding-top:10px; font-weight:800; font-size:1.15rem; color:var(--pine-dark); }
  .invoice-notes{ margin-top:26px; }
  .invoice-footer-note{ margin-top:30px; padding-top:16px; border-top:1px solid var(--line); font-size:0.8rem; color:var(--ink-soft); text-align:center; font-style:italic; }
  .invoice-paid-stamp{
    position:absolute; top:40%; right:8%; transform:translateY(-50%) rotate(-14deg);
    font-size:2.6rem; font-weight:800; letter-spacing:0.12em; color:var(--pine);
    border:5px solid var(--pine); border-radius:12px; padding:6px 22px; opacity:0.16;
    pointer-events:none; text-transform:uppercase; display:none;
  }
  .invoice-sheet.is-paid .invoice-paid-stamp{ display:block; }

@media print{
  /* Zero page margin stops the browser printing its own header/footer (page URL, date, title). The spacing lives on the sheet instead. */
  @page{ margin:0; }
  html, body{ background:#fff; }
  .wrap{ padding:0 !important; margin:0 !important; max-width:none !important; }
  .no-print{ display:none !important; }
  .invoice-wrap, .invoice-sheet{ position:static !important; width:auto !important; margin:0 !important; }
  .invoice-sheet{ border:none; border-radius:0; padding:14mm !important; box-shadow:none; }
  .invoice-sheet::before{ display:none; }
  .invoice-sheet input, .invoice-sheet textarea{ border:none !important; background:transparent !important; padding:2px 4px; resize:none !important; }
  .totals-row input{ padding:0 2px !important; }
}
</style>
</head>
<body>

<div class="wrap" id="app">
  <p id="loading">Loading…</p>
</div>

<script>
(function () {
  const app = document.getElementById('app');
  const PAGES = ['index', 'services'];
  let currentPage = null;
  let currentData = null;

  // ---------- API helpers ----------
  async function api(path, options) {
    const res = await fetch(path, {
      ...options,
      headers: { 'Content-Type': 'application/json', ...(options && options.headers) },
    });
    const body = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(body.error || `Request failed (${res.status})`);
    return body;
  }

  // ---------- Screens ----------
  async function boot() {
    try {
      const me = await api('/api/me');
      if (me.signedIn) {
        renderEditorShell(me.email);
      } else {
        renderLogin();
      }
    } catch {
      renderLogin();
    }
  }

  function renderLogin() {
    app.innerHTML = `
      <div class="login-card">
        <h1>Admin sign in</h1>
        <p class="sub">SIDDHI ElderCare Services</p>
        <form id="loginForm">
          <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" required autocomplete="username">
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input type="password" id="password" required autocomplete="current-password">
          </div>
          <button type="submit" class="btn" id="loginBtn">Sign in</button>
          <p class="error" id="loginError"></p>
        </form>
      </div>
    `;
    const form = document.getElementById('loginForm');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const errEl = document.getElementById('loginError');
      const btn = document.getElementById('loginBtn');
      errEl.classList.remove('is-visible');
      btn.disabled = true;
      btn.textContent = 'Signing in…';
      try {
        await api('/api/login', {
          method: 'POST',
          body: JSON.stringify({
            email: document.getElementById('email').value,
            password: document.getElementById('password').value,
          }),
        });
        const me = await api('/api/me');
        renderEditorShell(me.email);
      } catch (err) {
        errEl.textContent = err.message;
        errEl.classList.add('is-visible');
        btn.disabled = false;
        btn.textContent = 'Sign in';
      }
    });
  }

  function renderEditorShell(email) {
    app.innerHTML = `
            <div class="topbar no-print">
        <div>
          <h1>Edit site content</h1>
          <p class="sub">Signed in as ${escapeHtml(email)}</p>
        </div>
        <button class="btn btn-secondary" id="logoutBtn">Sign out</button>
      </div>
      <div class="page-picker no-print" id="pagePicker"></div>
      <div class="page-picker no-print" id="toolsPicker"></div>
      <div id="editorArea"><p id="loading">Choose a page above to start editing.</p></div>
    `;
    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await api('/api/logout', { method: 'POST' });
      renderLogin();
    });
    const picker = document.getElementById('pagePicker');
    PAGES.forEach((page) => {
      const btn = document.createElement('button');
      btn.textContent = page.charAt(0).toUpperCase() + page.slice(1);
      btn.addEventListener('click', () => loadPage(page, btn));
      picker.appendChild(btn);
    });
    const testimonialsBtn = document.createElement('button');
    testimonialsBtn.textContent = 'Testimonials';
    testimonialsBtn.addEventListener('click', () => {
      document.querySelectorAll('.page-picker button').forEach((b) => b.classList.remove('is-active'));
      testimonialsBtn.classList.add('is-active');
      renderTestimonialsUI(document.getElementById('editorArea'));
    });
    picker.appendChild(testimonialsBtn);

    const tools = document.getElementById('toolsPicker');
    const toolsLabel = document.createElement('p');
    toolsLabel.className = 'tools-label';
    toolsLabel.textContent = 'Tools';
    tools.appendChild(toolsLabel);
    const invoiceBtn = document.createElement('button');
    invoiceBtn.textContent = 'Invoicing';
    invoiceBtn.addEventListener('click', () => {
      document.querySelectorAll('.page-picker button').forEach((b) => b.classList.remove('is-active'));
      invoiceBtn.classList.add('is-active');
      renderInvoiceUI(document.getElementById('editorArea'));
    });
    tools.appendChild(invoiceBtn);
  }

  async function loadPage(page, btnEl) {
    document.querySelectorAll('.page-picker button').forEach((b) => b.classList.remove('is-active'));
    if (btnEl) btnEl.classList.add('is-active');
    const area = document.getElementById('editorArea');
    area.innerHTML = '<p id="loading">Loading content…</p>';
    try {
      const res = await api(`/api/content?page=${encodeURIComponent(page)}`);
      currentPage = page;
      currentData = res.data;
      renderForm(area, currentData);
    } catch (err) {
      area.innerHTML = `<p class="error is-visible">${escapeHtml(err.message)}</p>`;
    }
  }

  // ---------- Generic recursive form renderer ----------
  // Walks any JSON object/array-of-objects/string shape and renders matching
  // inputs. Extending a page's content later (adding a key to its JSON +
  // a data-k attribute in the HTML) needs no changes here — the form just
  // grows to match whatever the JSON contains.
  function renderForm(container, data) {
    container.innerHTML = '';
    const form = document.createElement('form');
    form.appendChild(renderNode(data, ''));

    const saveBar = document.createElement('div');
    saveBar.className = 'save-bar';
    saveBar.innerHTML = `
      <button type="submit" class="btn" id="saveBtn">Save changes</button>
      <span class="hint">Saved changes go live automatically within about a minute.</span>
    `;
    form.appendChild(saveBar);

    const successEl = document.createElement('p');
    successEl.className = 'success';
    successEl.id = 'saveSuccess';
    const errorEl = document.createElement('p');
    errorEl.className = 'error';
    errorEl.id = 'saveError';
    form.appendChild(successEl);
    form.appendChild(errorEl);

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      successEl.classList.remove('is-visible');
      errorEl.classList.remove('is-visible');
      const saveBtn = document.getElementById('saveBtn');
      saveBtn.disabled = true;
      saveBtn.textContent = 'Saving…';
      try {
        const updated = collectValues(form, currentData);
        const res = await api('/api/content', {
          method: 'POST',
          body: JSON.stringify({ page: currentPage, data: updated }),
        });
        currentData = updated;
        successEl.textContent = res.message || 'Saved.';
        successEl.classList.add('is-visible');
      } catch (err) {
        errorEl.textContent = err.message;
        errorEl.classList.add('is-visible');
      } finally {
        saveBtn.disabled = false;
        saveBtn.textContent = 'Save changes';
      }
    });

    container.appendChild(form);

  function renderNode(value, path) {
    if (Array.isArray(value)) {
      const wrap = document.createElement('div');
      value.forEach((item, i) => {
        const itemPath = path ? `${path}.${i}` : String(i);
        const box = document.createElement('div');
        box.className = 'group';
        const label = document.createElement('p');
        label.className = 'item-index';
        label.textContent = `Item ${i + 1}`;
        box.appendChild(label);
        box.appendChild(renderNode(item, itemPath));
        wrap.appendChild(box);
      });
      return wrap;
    }

    if (value !== null && typeof value === 'object') {
      const wrap = document.createElement('div');
      Object.keys(value).forEach((key) => {
        const childPath = path ? `${path}.${key}` : key;
        const child = value[key];
        if (typeof child === 'string') {
          wrap.appendChild(renderField(childPath, key, child));
        } else {
          const box = document.createElement('div');
          box.className = 'group';
          const title = document.createElement('p');
          title.className = 'group-title';
          title.textContent = humanize(key);
          box.appendChild(title);
          box.appendChild(renderNode(child, childPath));
          wrap.appendChild(box);
        }
      });
      return wrap;
    }

    // Fallback for an unexpected primitive at the root.
    return renderField(path, path, String(value));
  }

  function renderField(dataPath, label, value) {
    const field = document.createElement('div');
    field.className = 'field';
    const labelEl = document.createElement('label');
    labelEl.textContent = humanize(label);
    labelEl.setAttribute('for', `f_${dataPath}`);
    field.appendChild(labelEl);

    const long = value.length > 70;
    const input = document.createElement(long ? 'textarea' : 'input');
    if (!long) input.type = 'text';
    input.id = `f_${dataPath}`;
    input.dataset.path = dataPath;
    input.value = value;
    field.appendChild(input);
    return field;
  }

  function collectValues(form, original) {
    const clone = JSON.parse(JSON.stringify(original));
    form.querySelectorAll('[data-path]').forEach((el) => {
      setByPath(clone, el.dataset.path, el.value);
    });
    return clone;
  }

  function setByPath(obj, keyPath, value) {
    const parts = keyPath.split('.');
    let node = obj;
    for (let i = 0; i < parts.length - 1; i++) {
      node = node[/^\d+$/.test(parts[i]) ? Number(parts[i]) : parts[i]];
    }
    const lastKey = parts[parts.length - 1];
    node[/^\d+$/.test(lastKey) ? Number(lastKey) : lastKey] = value;
  }

  function humanize(key) {
    return String(key)
      .replace(/([a-z])([A-Z])/g, '$1 $2')
      .replace(/[_-]/g, ' ')
      .replace(/^./, (c) => c.toUpperCase());
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  // ---------- Testimonials manager ----------
  // Reviews (written and/or video) live in content/testimonials.json and are
  // rendered into testimonials.html at build time. Videos are YouTube/Vimeo
  // links — nothing is uploaded here, so there is no storage to manage.
  function parseVideoLink(input) {
    const raw = String(input || '').trim();
    if (!raw) return null;
    let u;
    try { u = new URL(/^https?:\/\//i.test(raw) ? raw : 'https://' + raw); } catch { return null; }
    const host = u.hostname.toLowerCase().replace(/^(www|m)\./, '');
    const seg = u.pathname.split('/').filter(Boolean);
    let id = null;
    let vertical = false;
    if (host === 'youtu.be') id = seg[0];
    else if (host === 'youtube.com' || host === 'youtube-nocookie.com') {
      if (seg[0] === 'watch') id = u.searchParams.get('v');
      else if (['shorts', 'embed', 'live', 'v'].includes(seg[0])) id = seg[1];
      vertical = seg[0] === 'shorts';
    }
    if (id && /^[A-Za-z0-9_-]{11}$/.test(id)) {
      return { provider: 'YouTube', thumb: 'https://i.ytimg.com/vi/' + id + '/hqdefault.jpg', vertical };
    }
    let vm = null;
    if (host === 'vimeo.com') vm = seg[0];
    else if (host === 'player.vimeo.com' && seg[0] === 'video') vm = seg[1];
    if (vm && /^\d{5,12}$/.test(vm)) return { provider: 'Vimeo', thumb: '', vertical: false };
    return null;
  }

  function tEl(tag, cls, text) {
    const node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text != null) node.textContent = text;
    return node;
  }

      function refresh() {

      });
      controls.appendChild(mk('↑', '', () => { reviews.splice(i - 1, 0, reviews.splice(i, 1)[0]); renderList(); }, i === 0, 'Move up'));
      controls.appendChild(mk('↓', '', () => { reviews.splice(i + 1, 0, reviews.splice(i, 1)[0]); renderList(); }, i === reviews.length - 1, 'Move down'));

        f.appendChild(input);

      const row = tEl('div', 'ta-row');

        if (!v) { status.textContent = '⚠ This isn’t a YouTube or Vimeo link.'; status.className = 'ta-vstatus bad'; return; }
        status.className = 'ta-vstatus ok';
        status.textContent = '✓ ' + v.provider + ' video recognised' + (v.vertical ? ' (vertical / Short)' : '') + '.';
        if (v.thumb) { prev.src = v.thumb; prev.hidden = false; }

      }
      const vf = textField('Video link (YouTube or Vimeo)', 'videoUrl', { max: 300, placeholder: 'https://www.youtube.com/watch?v=…', onInput: checkVideo });
      vf.field.appendChild(status);
      vf.field.appendChild(prev);

      panel.appendChild(textField('Custom thumbnail (optional)', 'thumbnail', { max: 300, placeholder: 'https://… or images/your-photo.jpg', note: 'Only needed for Vimeo, or to replace the automatic YouTube preview image.' }).field);

      function check(label, key, onChange, invert) {
        const wrap = tEl('label', 'ta-check');

      checks.appendChild(check('Show on the website', 'visible', null, true));
      checks.appendChild(check('Featured — show as the big story at the top (only one at a time)', 'featured', () => {
        if (r.featured) reviews.forEach((o) => { if (o !== r) o.featured = false; });

      checks.appendChild(check('Vertical video (recorded on a phone / YouTube Short)', 'vertical'));

        okEl.textContent = res.message || 'Saved.';
        okEl.classList.add('is-visible');
      } catch (err) {
        errEl.textContent = err.message;
        errEl.classList.add('is-visible');

      }

    try {
      const raw = localStorage.getItem(INVOICE_DRAFT_KEY);

      if (!Array.isArray(parsed.items) || !parsed.items.length) parsed.items = blankInvoice().items;
      return parsed;

  function formatMoney(n) {
    const num = Number(n) || 0;
    const sign = num < 0 ? '-' : '';
    return `${sign}₹${Math.abs(num).toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
  }

  const ONES = ['', 'One', 'Two', 'Three', 'Four', 'Five', 'Six', 'Seven', 'Eight', 'Nine', 'Ten', 'Eleven', 'Twelve',
    'Thirteen', 'Fourteen', 'Fifteen', 'Sixteen', 'Seventeen', 'Eighteen', 'Nineteen'];
  const TENS = ['', '', 'Twenty', 'Thirty', 'Forty', 'Fifty', 'Sixty', 'Seventy', 'Eighty', 'Ninety'];

  function twoDigitWords(n) {
    return n < 20 ? ONES[n] : TENS[Math.floor(n / 10)] + (n % 10 ? ' ' + ONES[n % 10] : '');
  }
  function threeDigitWords(n) {
    const hundreds = Math.floor(n / 100);
    const rest = n % 100;
    return (hundreds ? ONES[hundreds] + ' Hundred' + (rest ? ' ' : '') : '') + (rest ? twoDigitWords(rest) : '');
  }
  // Indian numbering: crore / lakh / thousand
  function wholeNumberWords(n) {
    if (n === 0) return 'Zero';
    const crore = Math.floor(n / 10000000);
    const lakh = Math.floor((n % 10000000) / 100000);
    const thousand = Math.floor((n % 100000) / 1000);
    const rest = n % 1000;
    const parts = [];
    if (crore) parts.push(threeDigitWords(crore) + ' Crore');
    if (lakh) parts.push(twoDigitWords(lakh) + ' Lakh');
    if (thousand) parts.push(twoDigitWords(thousand) + ' Thousand');
    if (rest) parts.push(threeDigitWords(rest));
    return parts.join(' ');
  }
  function amountInWords(amount) {
    const totalPaise = Math.round(Math.max(0, Number(amount) || 0) * 100);
    const rupees = Math.floor(totalPaise / 100);
    const paise = totalPaise % 100;
    return `${wholeNumberWords(rupees)} Rupees` + (paise ? ` and ${twoDigitWords(paise)} Paise` : '') + ' only';
  }

                <datalist id="invPaymentModes"><option value="Cash"><option value="Cheque"><option value="UPI"><option value="Bank transfer"><option value="International transfer"><option value="Card"></datalist>
              </div>
            </div>
          </div>

          <div class="invoice-foot">
            <div class="invoice-payto">
              <p class="party-label">Pay to</p>
              <div class="field-row"><label for="inv_bankAccount">Bank account no.</label><input id="inv_bankAccount" data-inv="bankAccount" inputmode="numeric" placeholder="Account number"></div>
            </div>
            <div class="invoice-sign">
              <p class="sign-for">For: SIDDHI ElderCare Services</p>
              <div class="sign-space"></div>
              <p class="sign-label">Authorized signatory</p>
            </div>
          </div>

          <p class="invoice-footer-note">SIDDHI ElderCare Services</p>
        </div>
      </div>
    `;

    // Populate top-level fields
    container.querySelectorAll('[data-inv]').forEach((el) => {
      const key = el.dataset.inv;
      if (key in inv) el.value = inv[key];
      el.addEventListener('input', () => {
        inv[key] = el.type === 'number' ? Number(el.value) : el.value;
        saveInvoiceDraft(inv);
        recalcInvoiceTotals(inv);
      });
    });

    const itemsBody = document.getElementById('invoiceItems');
    function renderItemRow(item, index) {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td class="row-num">${index + 1}</td>
        <td><input data-field="name" placeholder="Service / plan name"></td>
        <td><input data-field="qty" type="number" min="0" step="1"></td>
        <td><input data-field="rate" type="number" min="0" step="0.01"></td>
        <td class="row-amount">₹0.00</td>
        <td class="no-print"><button type="button" class="row-remove-btn" title="Remove line" aria-label="Remove line">&times;</button></td>
      `;
      tr.querySelector('[data-field="name"]').value = item.name;
      tr.querySelector('[data-field="qty"]').value = item.qty;
      tr.querySelector('[data-field="rate"]').value = item.rate;

      tr.querySelectorAll('input').forEach((el) => {
        el.addEventListener('input', () => {
          const field = el.dataset.field;
          inv.items[index][field] = field === 'name' ? el.value : Number(el.value);
          saveInvoiceDraft(inv);
          recalcInvoiceTotals(inv);
        });
      });
      tr.querySelector('.row-remove-btn').addEventListener('click', () => {
        if (inv.items.length <= 1) return;
        inv.items.splice(index, 1);
        saveInvoiceDraft(inv);
        renderItemsList();
        recalcInvoiceTotals(inv);
      });
      return tr;
    }

    function renderItemsList() {
      itemsBody.innerHTML = '';
      inv.items.forEach((item, i) => itemsBody.appendChild(renderItemRow(item, i)));
    }
    renderItemsList();
    recalcInvoiceTotals(inv);

    document.getElementById('addItemBtn').addEventListener('click', () => {
      inv.items.push({ name: '', qty: 1, rate: 0 });
      saveInvoiceDraft(inv);
      renderItemsList();
      recalcInvoiceTotals(inv);
    });

    document.getElementById('resetInvoiceBtn').addEventListener('click', () => {
      if (!confirm('Clear this invoice and start a new one?')) return;
      const usedNo = parseInt(inv.number, 10);
      if (!isNaN(usedNo)) { try { localStorage.setItem(INVOICE_LAST_NO_KEY, String(usedNo)); } catch {} }
      localStorage.removeItem(INVOICE_DRAFT_KEY);
      renderInvoiceUI(container);
    });

    document.getElementById('paidToggleBtn').addEventListener('click', () => {
      inv.paid = !inv.paid;
      saveInvoiceDraft(inv);
      const sheet = document.getElementById('invoiceSheet');
      const btn = document.getElementById('paidToggleBtn');
      sheet.classList.toggle('is-paid', inv.paid);
      btn.classList.toggle('is-paid', inv.paid);
      btn.textContent = inv.paid ? '✓ Marked as paid' : 'Mark as paid';
    });

    document.getElementById('exportPdfBtn').addEventListener('click', () => {
      window.print();
    });
  }

  function recalcInvoiceTotals(inv) {
    const round2 = (x) => Math.round(x * 100) / 100;
    const rows = document.querySelectorAll('#invoiceItems tr');
    let subtotal = 0;
    let qtyTotal = 0;
    inv.items.forEach((item, i) => {
      const qty = Number(item.qty) || 0;
      const amount = round2(qty * (Number(item.rate) || 0));
      subtotal += amount;
      qtyTotal += qty;
      const cell = rows[i] && rows[i].querySelector('.row-amount');
      if (cell) cell.textContent = formatMoney(amount);
    });
    subtotal = round2(subtotal);
    const taxPct = Number(inv.taxPct) || 0;
    const tax = round2(subtotal * (taxPct / 100));
    const total = round2(subtotal + tax);
    const balance = round2(total - (Number(inv.received) || 0));
    const setText = (id, text) => { const el = document.getElementById(id); if (el) el.textContent = text; };
    setText('invQtyTotal', String(qtyTotal));
    setText('invAmountTotal', formatMoney(subtotal));
    setText('invSubtotal', formatMoney(subtotal));
    setText('invTax', formatMoney(tax));
    setText('invTotal', formatMoney(total));
    setText('invBalance', formatMoney(balance));
    setText('invWords', amountInWords(total));
  }

  boot();
})();
</script>
</body>
</html>
